name: Build IPQuery IPA
on:
  push:
    branches: ["**"]
    paths:
      - "IPQuery/**"
      - ".github/workflows/ipquery.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build TrollStore IPA
        run: bash IPQuery/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IPQuery
          path: IPQuery/IPQuery.ipa
